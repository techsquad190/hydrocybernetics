<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    HydroCybernetics | Digital Intelligence for Urban Water Networks

  <meta name="description"
    content="HydroCybernetics — Urban water network digital twin and decision-support platform designed to integrate hydraulic modeling with network monitoring.">

  <meta name="theme-color" content="#081220">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- =========================================================
       Typography
       ========================================================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- =========================================================
       CSS Design System
       ========================================================= -->

  <link rel="stylesheet" href="css/variables.css">

  <link rel="stylesheet" href="css/base.css">

  <link rel="stylesheet" href="css/layout.css">

  <link rel="stylesheet" href="css/components.css">

  <link rel="stylesheet" href="css/network-visual.css">

  <link rel="stylesheet" href="css/digital-twin.css">
  <link rel="stylesheet" href="css/mobile.css">

</head>


<body>


  <!-- =========================================================
       Application Mount Node
       ========================================================= -->

  <div id="app-root"></div>


  <!-- =========================================================
       Core Configuration
       ========================================================= -->

  <script src="js/config.js"></script>

  <script src="js/icons.js"></script>

  <script src="js/network-canvas.js"></script>


  <!-- =========================================================
       Leaflet

       Kept only for compatibility with other existing modules.
       It is NOT used by the Digital Twin.
       ========================================================= -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    crossorigin=""></script>


  <!-- =========================================================
       Application Views

       Cesium is already loaded and configured BEFORE
       digital-twin.js.
       ========================================================= -->

  <script src="js/views/landing.js"></script>

  <script src="js/views/auth-citizen.js"></script>

  <script src="js/views/auth-municipal.js"></script>

  <script src="js/views/dashboard-citizen.js"></script>

  <script src="js/views/digital-twin.js"></script>

  <!-- Chart.js is required by the municipal dashboard -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="js/views/dashboard-municipal.js"></script>

  <script src="js/views/placeholder.js"></script>


  <!-- =========================================================
       Main Application
       ========================================================= -->

  <script src="js/app.js"></script>



  <!-- =========================================================
       PWA Service Worker
       ========================================================= -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js', { scope: './' })
          .then(() => console.log('[PWA] Service worker registered'))
          .catch((error) => console.warn('[PWA] Service worker registration failed:', error));
      });
    }
  </script>

</body>

</html>
